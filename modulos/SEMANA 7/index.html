<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=keyboard_double_arrow_down" />

    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="antialiased selection:bg-gray-950 selection:text-gray-50">
    <!--Hero section -->

    <!-- Hero Section -->
    <header class="relative h-screen flex flex-col items-center justify-center overflow-hidden">
        <div class="absolute inset-0 z-0">
            <!-- Partículas / Fondo sutil (simulado con un gradiente radial) -->
            <div
                class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-gray-900 via-black to-black opacity-80">
            </div>
        </div>

        <div class="relative z-10 text-center px-4 reveal-up active">
            <h2 class="text-xl md:text-2xl font-semibold tracking-widest text-gray-400 mb-4">iPhone 18 Pro</h2>
            <h1 class="text-5xl md:text-8xl font-bold tracking-tight mb-6 text-gradient">
                El Pro ,<br>va por más.
            </h1>
            <p class="text-lg md:text-2xl text-gray-400 max-w-2xl mx-auto font-light">
                Diseñado para alcanzar un rendimiento sin precedentes.
            </p>
        </div>

        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center animate-bounce opacity-50">
            <span class="text-sm mb-2 font-light">Descubre más</span>
            <span class="material-symbols-outlined">
                keyboard_double_arrow_down
            </span>
        </div>


    </header>


    <script src="./js/script.js"></script>
</body>

</html>
