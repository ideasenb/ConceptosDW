<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préstamo de Libros - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>
</head>

<body>

    <div class="container py-4" style="max-width: 850px;">


        <h1 class="text-center mb-4 fw-bold">Solicitud de Préstamo de Libros</h1>


        <form id="formularioSolicitud" class="card p-4 shadow-sm mb-4">

            <div class="mb-3">
                <label for="nombreUsuario" class="form-label fw-semibold">Nombre del usuario:</label>
                <input type="text" class="form-control form-control-lg" id="nombreUsuario"
                    placeholder="Ingresa el nombre del usuario (ej: Carlos)" required>
            </div>


            <div class="mb-3">
                <label for="librosInput" class="form-label fw-semibold">Libros solicitados (separados por coma):</label>
                <input type="text" class="form-control form-control-lg" id="librosInput"
                    placeholder="Ingresa los libros que quieras (ej: Cien años de soledad, El principito)" required>
                <div class="form-text">Puedes poner todos los libros que quieras separados por una coma (,).</div>
            </div>


            <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">Procesar Solicitud</button>
        </form>


        <div id="contenedorRespuesta" class="card p-4 shadow-sm" style="display: none;">
            <h5 class="fw-bold mb-3">Resultado de la Operación</h5>
            <div class="mb-3">
                <span class="text-muted fw-semibold d-block mb-1">Array inicial (Usuario + Libros):</span>
                <div class="alert alert-secondary font-monospace mb-0" id="arrayInicialTexto"></div>
            </div>
            <div>
                <span class="text-success fw-semibold d-block mb-1">Array modificado (con shift, unshift y push):</span>
                <div class="alert alert-success font-monospace fs-5 mb-0" id="arrayResultadoTexto"></div>
            </div>
        </div>

    </div>

</body>

</html>
